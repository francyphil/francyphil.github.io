<!doctype html>
<html lang="it">
  <head>
      <link rel="stylesheet" href="/common-bg.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lettera</title>
    <script src="/favicon-loader.js"></script>
    <link rel="stylesheet" href="/navbar/navbar.css">
    <link rel="stylesheet" href="/breadcrumb/breadcrumb.css">
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 0;
      }

      table {
        border-collapse: collapse;
        margin: 30px auto;
        width: auto;
      }

      th, td {
        border: 1px solid #ccc;
        padding: 8px 12px;
        text-align: center;
        white-space: nowrap;
      }

      th {
        background-color: #f0f0f0;
      }

      /* Mobile: tabelle scrollabili */
      @media (max-width: 768px) {
        .table-scroll {
          overflow-x: auto;
          -webkit-overflow-scrolling: touch;
          margin: 20px 0;
        }

        th, td {
          padding: 6px 8px;
          font-size: 0.85em;
        }
      }
    </style>
    <link rel="stylesheet" href="/footer/footer.css" />
  </head>
  <body>
    <script src="/navbar/navbar.js"></script>
    <div id="breadcrumbContainer"></div>
    <script src="/breadcrumb/breadcrumb.js"></script>

    <div class="content-container">
      <h1>Lettere e Biglietti postali</h1>

    <div id="tabelle"></div>

    <script>
      const tariffe = [
        {
          titolo: "Lettere e Biglietti postali",
          nota: "15 gr per ogni porto",
          voci: [
            ["28.10.1901*",  "0,20"],            
            ["1.9.1905",  "0,15"],
            ["1.1.1916",  "0,20"],
            ["1.3.1919",  "0,25"],
            ["1.2.1921",  "0,40"],
            ["1.1.1923",  "0,50"],
            ["16.3.1925", "0,60"],
            ["16.8.1927", "0,50"],
            ["1.10.1944", "1,00"],
            ["1.4.1945",  "2,00"],
          ]
        },
        {
          titolo: "entro il distretto",
          nota: "15 gr per ogni porto",
          voci: [
            ["28.10.1901*", "0,05"],
            ["1.12.1916", "0,10"],
            ["1.3.1919",  "0,15"],
            ["1.2.1921",  "0,20"],
            ["1.1.1923",  "0,25"],
            ["16.3.1925", "0,30"],
            ["16.8.1927", "0,25"],
            ["1.10.1944", "0,50"],
            ["1.4.1945",  "1,00"],
          ]
        },
        {
          titolo: "Corrispondenza Sindaci",
          nota: "15 gr per ogni porto",
          voci: [
            ["28.10.1901*","0,10"],
            ["1.2.1921",  "0,20"],
            ["1.1.1923",  "0,25"],
            ["16.3.1925", "0,30"],
            ["16.8.1927", "0,25"],
          ]
        },
        {
          titolo: "Corrispondenza dirette ai militari",
          nota: "solo fino al primo porto",
          voci: [
            ["28.10.1901*","0,10"],
            ["1.2.1921",  "0,20"],
            ["1.1.1923",  "0,25"],
            ["16.3.1925", "0,30"],
            ["16.8.1927", "0,25"],
            ["1.10.1944", "0,50"],
            ["1.4.1945",  "1,00"],            
          ]
        }        
      ];

      const container = document.getElementById("tabelle");
      tariffe.forEach(t => {
        const wrap = document.createElement("div");
        wrap.className = "table-scroll";
        wrap.innerHTML = `
          <table>
            <thead><tr>
              <th>${t.titolo}</th>
              ${t.voci.map(([d]) => `<th>${d}</th>`).join("")}
            </tr></thead>
            <tbody><tr>
              <td></td>
              ${t.voci.map(([, v]) => `<td>${v}</td>`).join("")}
            </tr></tbody>
          </table>`;
        container.appendChild(wrap);
        const nota = document.createElement("p");
        nota.textContent = t.nota;
        container.appendChild(nota);
      });
    </script>
    </div>

    <script src="/footer/footer.js"></script>
    <div id="footerContainer"></div>
  </body>
</html>
