<!doctype html>
<html lang="it">
  <head>
      <link rel="stylesheet" href="/common-bg.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cartolina</title>
    <script src="/favicon-loader.js"></script>
    <link rel="stylesheet" href="/navbar/navbar.css">
    <link rel="stylesheet" href="/breadcrumb/breadcrumb.css">
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 0;
      }

      table {
        border-collapse: collapse;
        margin: 30px auto;
        width: auto;
      }

      th, td {
        border: 1px solid #ccc;
        padding: 8px 12px;
        text-align: center;
        white-space: nowrap;
      }

      th {
        background-color: #f0f0f0;
      }

      /* Mobile: tabelle scrollabili */
      @media (max-width: 768px) {
        .table-scroll {
          overflow-x: auto;
          -webkit-overflow-scrolling: touch;
          margin: 20px 0;
        }

        th, td {
          padding: 6px 8px;
          font-size: 0.85em;
        }
      }
    </style>
    <link rel="stylesheet" href="/footer/footer.css" />
  </head>
  <body>
    <script src="/navbar/navbar.js"></script>
    <div id="breadcrumbContainer"></div>
    <script src="/breadcrumb/breadcrumb.js"></script>

    <div class="content-container">
      <h1>Cartolina</h1>

    <div id="tabelle"></div>

    <script>
      const tariffe = [
        {
          titolo: "Cartolina postale",
          nota: "",
          voci: [
            ["28.10.1901*",  "0,10"], 
            ["1.3.1919",     "0,15"],
            ["1.2.1921",  "0,25"],
            ["1.1.1923",  "0,30"],
            ["16.3.1925", "0,40"],
            ["16.8.1927", "0,30"],
            ["1.10.1944", "0,60"],
            ["1.4.1945",  "1,20"],
          ]
        },
        {
          titolo: "entro il distretto",
          nota: "",
          voci: [
            ["28.10.1901*", "0,10"],
            ["14.4.1917", "0,05"],
            ["1.3.1919",     "0,10"],
            ["1.2.1921",  "0,15"],
            ["16.3.1925", "0,20"],
            ["16.8.1927", "0,15"],
            ["1.10.1944", "0,30"],   
            ["1.4.1945",  "0,60"],                     
          ]
        },
        {
          titolo: "Corrispondenza Sindaci",
          nota: "",
          voci: [
            ["28.10.1901*","0,05"],
            ["1.3.1919",     "0,10"],
            ["1.2.1921",  "0,15"],
            ["16.3.1925", "0,20"],
            ["16.8.1927", "0,15"],
            ["1.10.1944", "0,30"],
            ["1.4.1945",  "0,60"],             
          ]
        },
        {
          titolo: "Corrispondenza dirette ai militari",
          nota: "",
          voci: [
            ["28.10.1901*","0,10"],
            ["1.2.1921",  "0,15"],
            ["16.3.1925", "0,20"],
            ["16.8.1927", "0,15"],   
            ["1.10.1944", "0,30"],   
            ["1.4.1945",  "0,60"],                              
          ]
        },
        {
          titolo: "Cartolina illustrata",
          nota: "",
          voci: [
            ["1.9.1905","0,05"],
            ["1.8.1918","0,10"],  
            ["1.3.1919","fine tariffa speciale"],  
            ["1.1.1924","0,15"],   
            ["1.7.1924","fine tariffa speciale"],                                 
          ]
        },        
        {
          titolo: "Cartolina illustrata solo firma",
          nota: "",
          voci: [
            ["1.3.1919","0,05"],  
            ["1.1.1923","0,10"],     
            ["1.1.1924","fine tariffa speciale"],
            ["1.7.1924","0,10"],    
            ["26.3.1942","fine tariffa speciale"],    
            ["1.10.1944","0,20"],   
            ["1.4.1945","0,40"],                                    
          ]
        },
        {
          titolo: "Cartolina illustrata 5 parole",
          nota: "",
          voci: [
            ["1.3.1919","0,10"],  
            ["1.2.1921","0,15"],     
            ["1.1.1924","fine tariffa speciale"],    
            ["1.7.1924","0,15"],      
            ["6.3.1925","0,20"],
            ["26.3.1942","fine tariffa speciale"],  
            ["1.10.1944","0,40"],    
            ["1.4.1945","0,80"],                                
          ]
        },
        {
          titolo: "Cartolina illustrata 5 parole nel distretto",
          nota: "",
          voci: [
            ["1.3.1919","0,05"],  
            ["1.2.1921","0,10"],          
            ["1.1.1924","fine tariffa speciale"],                         
          ]
        }
      ];

      const container = document.getElementById("tabelle");
      tariffe.forEach(t => {
        const wrap = document.createElement("div");
        wrap.className = "table-scroll";
        wrap.innerHTML = `
          <table>
            <thead><tr>
              <th>${t.titolo}</th>
              ${t.voci.map(([d]) => `<th>${d}</th>`).join("")}
            </tr></thead>
            <tbody><tr>
              <td></td>
              ${t.voci.map(([, v]) => `<td>${v}</td>`).join("")}
            </tr></tbody>
          </table>`;
        container.appendChild(wrap);
        const nota = document.createElement("p");
        nota.textContent = t.nota;
        container.appendChild(nota);
      });
    </script>
    </div>
    
    <script src="/footer/footer.js"></script>
    <div id="footerContainer"></div>
  </body>
</html>
