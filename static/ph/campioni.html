<!doctype html>
<html lang="it">
  <head>
      <link rel="stylesheet" href="/common-bg.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campioni senza valore</title>
    <script src="/favicon-loader.js"></script>
    <link rel="stylesheet" href="/navbar/navbar.css">
    <link rel="stylesheet" href="/breadcrumb/breadcrumb.css">
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 0;
      }

      table {
        border-collapse: collapse;
        margin: 30px auto;
        width: auto;
      }

      th, td {
        border: 1px solid #ccc;
        padding: 8px 12px;
        text-align: center;
        white-space: nowrap;
        vertical-align: top;
      }

      th {
        background-color: #f0f0f0;
      }

      /* Mobile: tabelle scrollabili */
      @media (max-width: 768px) {
        .table-scroll {
          overflow-x: auto;
          -webkit-overflow-scrolling: touch;
          margin: 20px 0;
        }

        th, td {
          padding: 6px 8px;
          font-size: 0.85em;
        }
      }
    </style>
    <link rel="stylesheet" href="/footer/footer.css" />
  </head>
  <body>
    <script src="/navbar/navbar.js"></script>
    <div id="breadcrumbContainer"></div>
    <script src="/breadcrumb/breadcrumb.js"></script>

    <div class="content-container">
      <h1>Campioni senza valore</h1>

    <div id="tabelle"></div>

    <script>
      const tariffe = [
        {
          titolo: "Campioni senza valore",
          nota: " porto da 50g fino ad un massimo di 350g fino a 30.9.1944 poi 500g",
          voci: [
            ["28.10.1901*","0,02"],
            ["1.3.1913", "0,04 fino a 50g\n0,02 per ogni 50g aggiuntivi"],
            ["1.8.1918", "0,10 fino a 50g\n0,05 per ogni 50g aggiuntivi"],
            ["1.4.1920", "0,20 fino a 100g\n0,10 per ogni 50g aggiuntivi"],
            ["1.1.1923", "0,30 fino a 100g\n0,15 per ogni 50g aggiuntivi"],
            ["16.3.1925", "0,40 fino a 100g\n0,20 per ogni 50g aggiuntivi"],
            ["21.6.1927", "0,35 fino a 100g\n0,15 per ogni 50g aggiuntivi"],
            ["1.10.1944", "0,70 fino a 100g\n0,30 per ogni 50g aggiuntivi"],
            ["1.4.1945",  "1,40 fino a 100g\n0,60 per ogni 50g aggiuntivi"],
          ]
        }
      ];

      const container = document.getElementById("tabelle");
      tariffe.forEach(t => {
        const wrap = document.createElement("div");
        wrap.className = "table-scroll";
        wrap.innerHTML = `
          <table>
            <thead><tr>
              <th>${t.titolo}</th>
              <th>Tariffa</th>
            </tr></thead>
            <tbody>
              ${t.voci.map(([d, v]) => `<tr><th>${d}</th><td>${v.replace(/\n/g, '<br>')}</td></tr>`).join("")}
            </tbody>
          </table>`;
        container.appendChild(wrap);
        const nota = document.createElement("p");
        nota.textContent = t.nota;
        container.appendChild(nota);
      });
    </script>
    </div>

    <script src="/footer/footer.js"></script>
    <div id="footerContainer"></div>
  </body>
</html>
