<!doctype html>
<html lang="it">
  <head>
    <link rel="stylesheet" href="/common-bg.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dettagli Località</title>
    <script src="/favicon-loader.js"></script>
    <link rel="stylesheet" href="/navbar/navbar.css" />
    <link rel="stylesheet" href="/breadcrumb/breadcrumb.css" />
    <style>
      body {
        font-family: sans-serif;
        padding: 0;
      }

      .locality-header {
        background-color: #f0f0f0;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 30px;
      }

      .locality-header h1 {
        margin: 0 0 10px 0;
      }

      .locality-header p {
        margin: 5px 0;
        font-size: 16px;
      }

      /* Tabella targhette */
      .table-wrapper {
        overflow-x: auto;
        margin-top: 20px;
      }

      table {
        border-collapse: collapse;
        width: 100%;
        max-width: 100%;
        table-layout: fixed;
      }

      th,
      td {
        border: 1px solid #ccc;
        padding: 5px 10px;
        text-align: left;
      }

      th {
        background-color: #f0f0f0;
      }

      tr:nth-child(even) {
        background-color: #f9f9f9;
      }

      tr:hover {
        background-color: #f0f0f0;
      }

      a {
        color: #0066cc;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .no-results {
        text-align: center;
        padding: 40px;
        color: #999;
        font-size: 18px;
      }

      .stats {
        margin-top: 20px;
        padding: 15px;
        background-color: #e8f4f8;
        border-left: 4px solid #0066cc;
        border-radius: 4px;
      }

      details {
        margin-top: 20px;
        border-bottom: 2px solid #0066cc;
      }

      details summary {
        cursor: pointer;
        padding: 8px 0;
        font-size: 1.17em;
        font-weight: bold;
      }

      details summary:hover {
        color: #0066cc;
      }
    </style>
    <link rel="stylesheet" href="/footer/footer.css" />
  </head>
  <body>
    <div id="breadcrumbContainer"></div>
    <script src="/breadcrumb/breadcrumb.js"></script>
    <div class="content-container">
      <div class="locality-header">
        <h1 id="localityTitle">Località</h1>
        <p id="localityInfo"></p>
      </div>

      <!-- (datari images removed) -->

      <!-- Contenitore grafico: anni x denominazioni ufficio -->
      <div
        id="datariChartBlock"
        style="display: none; margin-top: 18px; text-align: center"
      >
        <strong>Uso delle denominazioni ufficio nel tempo</strong>
        <div id="datariChart" style="margin-top: 8px; text-align: center"></div>
      </div>

      <div id="chartControls" style="display:none; margin-top:8px; padding:10px 16px; background:#f7f7f7; border:1px solid #ddd; border-radius:6px; text-align:center;">
        <span style="font-weight:bold; margin-right:14px; font-size:14px;">Mostra nel grafico:</span>
        <label style="margin-right:14px; cursor:pointer; font-size:14px;">
          <input type="checkbox" id="chkTarghette" checked>
          <span style="display:inline-block;width:10px;height:10px;background:#333;margin:0 4px 0 2px;vertical-align:middle;"></span>Targhette
        </label>
        <label style="margin-right:14px; cursor:pointer; font-size:14px;">
          <input type="checkbox" id="chkOnde" checked>
          <span style="display:inline-block;width:10px;height:10px;background:#f5c542;margin:0 4px 0 2px;vertical-align:middle;"></span>Onde
        </label>
        <label style="margin-right:14px; cursor:pointer; font-size:14px;">
          <input type="checkbox" id="chkBarre" checked>
          <span style="display:inline-block;width:10px;height:10px;background:#2266cc;margin:0 4px 0 2px;vertical-align:middle;"></span>Barre
        </label>
        <label style="cursor:pointer; font-size:14px;">
          <input type="checkbox" id="chkSoloDatario" checked>
          <span style="display:inline-block;width:10px;height:10px;background:#27ae60;margin:0 4px 0 2px;vertical-align:middle;"></span>Solo datario
        </label>
      </div>

      <div class="stats">
        <strong>Targhette trovate:</strong> <span id="statsCount">0</span>
      </div>

      <div id="tablesContainer"></div>

      <div id="noResults" class="no-results" style="display: none">
        Nessuna targhetta trovata per questa località.
      </div>

      <script src="/navbar/navbar.js"></script>
      <script>
        // Estrae i parametri dall'URL
        function getURLParams() {
          const params = new URLSearchParams(window.location.search);
          return {
            localita: params.get("localita"),
          };
        }

        // Dati globali per ridisegno del grafico
        let _chartFiltered = [], _chartOndeFiltered = [], _chartBarreFiltered = [], _chartSoloDatarioFiltered = [], _chartLocalita = "";

        // Carica e filtra i dati
        async function loadLocalityDetails() {
          const { localita } = getURLParams();

          if (!localita) {
            document.getElementById("localityTitle").textContent =
              "Località non trovata";
            return;
          }

          // Aggiorna titolo
          document.getElementById("localityTitle").textContent = `${localita}`;
          document.getElementById("localityInfo").textContent =
            `Tutte le targhette di questa località, ordinate per anno`;

          try {
            // Carica i tre JSON
            const [response, ondeResponse, barreResponse, soloDatarioResponse] = await Promise.all([
              fetch("targhetteRegno.json"),
              fetch("OndeRegno.json"),
              fetch("BarreRegno.json"),
              fetch("SoloDatarioRegno.json")
            ]);
            const data = await response.json();
            const ondeData = await ondeResponse.json();
            const barreData = await barreResponse.json();
            const soloDatarioData = await soloDatarioResponse.json();

            // Filtra solo per localita (indipendentemente dall'ufficio)
            const filtered = data.filter(
              (item) => item["Località"] === localita,
            );
            const ondeFiltered = ondeData.filter(
              (item) => item["Località"] === localita,
            );
            const barreFiltered = barreData.filter(
              (item) => item["Località"] === localita,
            );
            const soloDatarioFiltered = soloDatarioData.filter(
              (item) => item["Località"] === localita,
            );

            // Ordina per anno (ascendente), poi per ufficio
            filtered.sort((a, b) => {
              if (a.Anno === b.Anno) {
                if (a["Denominazione ufficio"] === b["Denominazione ufficio"]) {
                  return a["Targhetta Ufficio"] - b["Targhetta Ufficio"];
                }
                return a["Denominazione ufficio"].localeCompare(
                  b["Denominazione ufficio"],
                );
              }
              return a.Anno - b.Anno;
            });

            // Mostra risultati tabella (una tabella per ufficio)
            if (filtered.length === 0) {
              document.getElementById("noResults").style.display = "block";
              document.getElementById("tablesContainer").innerHTML = "";
              document.getElementById("statsCount").textContent = "0";
            } else {
              const container = document.getElementById("tablesContainer");
              container.innerHTML = "";

              // Raggruppa per Denominazione ufficio
              const groups = new Map();
              filtered.forEach((item) => {
                const key = item["Denominazione ufficio"] || "";
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(item);
              });

              // Itera in ordine alfabetico per nome ufficio
              const sortedOffices = Array.from(groups.keys()).sort((a, b) => a.localeCompare(b));
              sortedOffices.forEach((officeName) => {
                const items = groups.get(officeName);
                // Sezione collassabile
                const details = document.createElement("details");
                const summary = document.createElement("summary");
                const officeLink = document.createElement("a");
                officeLink.href = `ufficioDettaglio.html?denominazione=${encodeURIComponent(officeName)}&localita=${encodeURIComponent(localita)}`;
                officeLink.textContent = officeName;
                summary.appendChild(officeLink);
                details.appendChild(summary);

                // Wrapper + tabella
                const wrapper = document.createElement("div");
                wrapper.className = "table-wrapper";
                const table = document.createElement("table");

                const colgroup = document.createElement("colgroup");
                ["10%", "14%", "14%", "62%"].forEach((w) => {
                  const col = document.createElement("col");
                  col.style.width = w;
                  colgroup.appendChild(col);
                });
                table.appendChild(colgroup);

                const thead = document.createElement("thead");
                const headRow = document.createElement("tr");
                ["Anno", "Targhetta Tipo", "Targhetta Ufficio", "Descrizione"].forEach((text) => {
                  const th = document.createElement("th");
                  th.textContent = text;
                  headRow.appendChild(th);
                });
                thead.appendChild(headRow);
                table.appendChild(thead);

                const tbody = document.createElement("tbody");
                items.forEach((item) => {
                  const tr = document.createElement("tr");

                  const tdAnno = document.createElement("td");
                  tdAnno.textContent = item.Anno;

                  const tdTipo = document.createElement("td");
                  tdTipo.textContent = item["Targhetta Tipo"];

                  const tdUfficio = document.createElement("td");
                  tdUfficio.textContent = item["Targhetta Ufficio"];

                  const tdDescrizione = document.createElement("td");
                  tdDescrizione.textContent = item["Descrizione"];

                  tr.appendChild(tdAnno);
                  tr.appendChild(tdTipo);
                  tr.appendChild(tdUfficio);
                  tr.appendChild(tdDescrizione);

                  tbody.appendChild(tr);
                });
                table.appendChild(tbody);
                wrapper.appendChild(table);
                details.appendChild(wrapper);
                container.appendChild(details);
              });

              document.getElementById("statsCount").textContent =
                filtered.length;
              document.getElementById("noResults").style.display = "none";
            }

            // Salva i dati per il ridisegno del grafico
            _chartFiltered = filtered;
            _chartOndeFiltered = ondeFiltered;
            _chartBarreFiltered = barreFiltered;
            _chartSoloDatarioFiltered = soloDatarioFiltered;
            _chartLocalita = localita;

            // Disegna sempre il grafico (mostra targhette, onde, barre e/o solo datario)
            renderChart(filtered, localita, ondeFiltered, barreFiltered, soloDatarioFiltered);

            // Collega i checkbox ai controlli del grafico
            ['chkTarghette','chkOnde','chkBarre','chkSoloDatario'].forEach(id => {
              document.getElementById(id)?.addEventListener('change', () => {
                renderChart(_chartFiltered, _chartLocalita, _chartOndeFiltered, _chartBarreFiltered, _chartSoloDatarioFiltered);
              });
            });
          } catch (error) {
            console.error("Errore caricamento dati:", error);
            document.getElementById("localityTitle").textContent =
              "Errore caricamento dati";
          }
        }

        // Render simple SVG chart: years (x) × offices (y)
        function renderChart(records, localita, ondeRecords, barreRecords, soloDatarioRecords) {
          const chartContainer = document.getElementById("datariChart");
          const controlsBlock = document.getElementById("chartControls");
          chartContainer.innerHTML = "";

          // definizione fonti con colori
          const allSources = [
            { records: records, color: '#333', label: 'Targhette', chkId: 'chkTarghette' },
            { records: ondeRecords, color: '#f5c542', label: 'Onde', chkId: 'chkOnde' },
            { records: barreRecords, color: '#2266cc', label: 'Barre', chkId: 'chkBarre' },
            { records: soloDatarioRecords, color: '#27ae60', label: 'Solo datario', chkId: 'chkSoloDatario' }
          ];

          // Filtra fonti attive in base ai checkbox
          const sources = allSources.filter(src => {
            const el = document.getElementById(src.chkId);
            return !el || el.checked;
          });

          if (controlsBlock) controlsBlock.style.display = 'block';
          if (sources.length === 0) {
            chartContainer.innerHTML = '<p style="text-align:center;color:#999;padding:20px;">Seleziona almeno una categoria.</p>';
            document.getElementById("datariChartBlock").style.display = "block";
            return;
          }

          const officeSet = new Set();
          const yearSet = new Set();
          sources.forEach(src => {
            src.records.forEach(r => {
              if (r["Denominazione ufficio"]) officeSet.add(r["Denominazione ufficio"]);
              if (r.Anno) yearSet.add(Number(r.Anno));
            });
          });
          const offices = Array.from(officeSet).sort();
          if (offices.length === 0 || yearSet.size === 0) {
            document.getElementById("datariChartBlock").style.display = "none";
            if (controlsBlock) controlsBlock.style.display = 'none';
            return;
          }
          const years = Array.from(yearSet).sort((a, b) => a - b);
          const minY = years[0];
          const maxY = years[years.length - 1];
          const fullYears = [];
          for (let y = minY; y <= maxY; y++) fullYears.push(y);

          const cell = 16;
          const left = 180;
          const top = 20;
          // calcola larghezza legenda
          const legendRowW = sources.reduce((acc, item) => acc + 16 + item.label.length * 6.5 + 14, 0) - 14;
          const w = Math.max(left + fullYears.length * cell + 40, legendRowW + 40);
          const h = top + offices.length * cell + 80;
          const svgNS = "http://www.w3.org/2000/svg";
          const svg = document.createElementNS(svgNS, "svg");
          svg.setAttribute("width", w);
          svg.setAttribute("height", h);
          svg.setAttribute("style", "display:block; margin:0 auto;");

          // vertical grid lines (years)
          fullYears.forEach((yr, i) => {
            const x = left + i * cell;
            const line = document.createElementNS(svgNS, "line");
            line.setAttribute("x1", x);
            line.setAttribute("y1", top - 6);
            line.setAttribute("x2", x);
            line.setAttribute("y2", top + offices.length * cell);
            line.setAttribute("stroke", "#ddd");
            line.setAttribute("stroke-width", "1");
            svg.appendChild(line);
          });

          // horizontal grid lines (offices)
          offices.forEach((d, j) => {
            const y = top + j * cell;
            const line = document.createElementNS(svgNS, "line");
            line.setAttribute("x1", left - 6);
            line.setAttribute("y1", y);
            line.setAttribute("x2", left + fullYears.length * cell);
            line.setAttribute("y2", y);
            line.setAttribute("stroke", "#bbb");
            line.setAttribute("stroke-width", "2");
            svg.appendChild(line);

            // office label on left (clickable)
            const text = document.createElementNS(svgNS, "text");
            text.setAttribute("x", left - 10);
            text.setAttribute("y", y + cell / 2 + 3);
            text.setAttribute("font-size", "12");
            text.setAttribute("text-anchor", "end");
            text.textContent = d;
            // make label clickable to office page
            text.style.cursor = "pointer";
            const officeUrl = `ufficioDettaglio.html?denominazione=${encodeURIComponent(d)}&localita=${encodeURIComponent(localita || "")}`;
            text.addEventListener("click", () => {
              window.location.href = officeUrl;
            });
            svg.appendChild(text);
          });

          // linea orizzontale finale sotto l'ultimo elemento
          const bottomY = top + offices.length * cell;
          const bottomLine = document.createElementNS(svgNS, "line");
          bottomLine.setAttribute("x1", left - 6);
          bottomLine.setAttribute("y1", bottomY);
          bottomLine.setAttribute("x2", left + fullYears.length * cell);
          bottomLine.setAttribute("y2", bottomY);
          bottomLine.setAttribute("stroke", "#bbb");
          bottomLine.setAttribute("stroke-width", "2");
          svg.appendChild(bottomLine);

          // year labels rotated (centered under cells)
          fullYears.forEach((yr, i) => {
            const x = left + i * cell + cell / 2;
            const baseY = top + offices.length * cell + cell / 2;
            const text = document.createElementNS(svgNS, "text");
            text.setAttribute("x", x - 12);
            text.setAttribute("y", baseY);
            text.setAttribute("font-size", "12");
            text.setAttribute("text-anchor", "middle");
            text.setAttribute("dominant-baseline", "middle");
            text.setAttribute("transform", `rotate(-90 ${x} ${baseY})`);
            text.textContent = yr;
            svg.appendChild(text);
          });

          // squares — strisce verticali per ogni fonte attiva
          offices.forEach((office, j) => {
            fullYears.forEach((yr, i) => {
              const activeColors = sources
                .filter(src => src.records.some(
                  r => r["Denominazione ufficio"] === office && Number(r.Anno) === yr
                ))
                .map(src => src.color);
              if (activeColors.length === 0) return;
              const x = left + i * cell + 1;
              const y = top + j * cell + 1;
              const s = cell - 2;
              const sw = s / activeColors.length;
              activeColors.forEach((color, idx) => {
                const rect = document.createElementNS(svgNS, 'rect');
                rect.setAttribute('x', x + idx * sw);
                rect.setAttribute('y', y);
                rect.setAttribute('width', sw);
                rect.setAttribute('height', s);
                rect.setAttribute('fill', color);
                svg.appendChild(rect);
              });
            });
          });

          // Legenda centrata
          const legendY = h - 20;
          let lx = (w - legendRowW) / 2;
          sources.forEach(item => {
            const r = document.createElementNS(svgNS, 'rect');
            r.setAttribute('x', lx); r.setAttribute('y', legendY - 10);
            r.setAttribute('width', 12); r.setAttribute('height', 12);
            r.setAttribute('fill', item.color);
            svg.appendChild(r);
            const t = document.createElementNS(svgNS, 'text');
            t.setAttribute('x', lx + 16); t.setAttribute('y', legendY);
            t.setAttribute('font-size', '11'); t.setAttribute('fill', '#333');
            t.textContent = item.label;
            svg.appendChild(t);
            lx += 16 + item.label.length * 6.5 + 14;
          });

          chartContainer.appendChild(svg);
          document.getElementById("datariChartBlock").style.display = "block";
        }

        // Carica quando il DOM è pronto
        document.addEventListener("DOMContentLoaded", loadLocalityDetails);
      </script>
    </div>

    <script src="/footer/footer.js"></script>
    <div id="footerContainer"></div>
  </body>
</html>
