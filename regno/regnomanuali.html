<!doctype html>
<html lang="it">
  <head>
      <link rel="stylesheet" href="/common-bg.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Regno Annulli Manuali</title>
    <script src="/favicon-loader.js"></script>
    <link rel="stylesheet" href="/navbar/navbar.css">
    <link rel="stylesheet" href="/breadcrumb/breadcrumb.css">
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 0;
      }

      h1 {
        text-align: center !important;
        color: #2c3e50;
        font-size: 2.2em;
        margin: 40px 0 50px 0;
        font-weight: 600;
      }

      .categories-container {
        max-width: 1100px;
        margin: 0 auto;
        flex-direction: row;
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
      }

      .category-card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        padding: 10px;
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: inherit;
        border: 2px solid #e0e0e0;
        width: 320px;
        aspect-ratio: 2 / 1;
        text-align: center;
        box-sizing: border-box;
      }

      .category-card:hover {
        box-shadow: 0 6px 20px rgba(76, 175, 80, 0.25);
        border-color: #4caf50;
      }

      .category-icon {
        width: 280px;
        height: 140px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        color: white;
        margin-top: 12px;
        margin-bottom: 12px;
        overflow: hidden;
      }

      .category-icon:not(:has(img)) {
        background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
      }

      .category-icon img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 8px;
      }

      .category-content {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .category-title {
        font-size: 1.2em;
        font-weight: 600;
        color: #2c3e50;
        margin: 0 0 5px 0;
      }

      @media (max-width: 768px) {
        h1 {
          font-size: 1.4em !important;
          margin: 25px 15px 30px 15px;
        }

        .categories-container {
          gap: 12px;
          padding: 0 15px;
        }

        .category-card {
          width: calc((100% - 12px) / 2);
          aspect-ratio: auto;
          min-height: 150px;
          padding: 15px 10px;
        }

        .category-icon {
          width: 180px;
          height: 90px;
          font-size: 24px;
          border-radius: 10px;
          margin-bottom: 8px;
        }

        .category-title {
          font-size: 1em;
        }
      }

      @media (max-width: 400px) {
        .category-card {
          width: 100%;
        }
      }
    </style>
    <link rel="stylesheet" href="/footer/footer.css" />
  </head>
  <body>
    <script src="/navbar/navbar.js"></script>
    <div id="breadcrumbContainer"></div>
    <script src="/breadcrumb/breadcrumb.js"></script>

    <div class="content-container">
      <h1>Regno annulli manuali o pseudomeccanici</h1>

      <p>
        In questa categoria rientrano impronte di natura e utilizzo diversi,
        accomunate dall'intento di imitare un annullo meccanico, da cui deriva
        il nome.
      </p>

      <div class="categories-container">
        <div class="category-card">
          <div class="category-icon">1</div>
          <div class="category-content">
            <div class="category-title">Milano 1906 Esposizione</div>
          </div>
        </div>

        <div class="category-card">
          <div class="category-icon">
            <img src="manuali/Veglionissimo_della_stampa_teatro_la_pergola__Firenze_posta_speciale_square.png" alt="Veglionissimo della stampa, Teatro La Pergola" />
          </div>
          <div class="category-content">
            <div class="category-title">Veglionissimo La Stampa</div>
          </div>
        </div>

        <div class="category-card">
          <div class="category-icon">
            <img src="manuali/Votate_La_Lista_Nazionale__Piacenza%202_square.png" alt="Votate la lista nazionale, Piacenza" />
          </div>
          <div class="category-content">
            <div class="category-title">Votate la lista nazionale</div>
          </div>
        </div>

        <div class="category-card">
          <div class="category-icon">4</div>
          <div class="category-content">
            <div class="category-title">Mare</div>
          </div>
        </div>
      </div>

    </div>

    <script src="/footer/footer.js"></script>
    <div id="footerContainer"></div>
  </body>
</html>
