<!doctype html>
<html lang="it">
  <head>
    <link rel="stylesheet" href="/common-bg.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recapito Autorizzato - Regno</title>
    <script src="/favicon-loader.js"></script>
    <link rel="stylesheet" href="/navbar/navbar.css" />
    <link rel="stylesheet" href="/breadcrumb/breadcrumb.css" />
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 0;
      }

      .gallery-section {
        max-width: 1100px;
        margin: 0 auto 40px auto;
        padding: 0 20px;
      }

      .gallery-section h2 {
        color: #2c3e50;
        border-bottom: 2px solid #4caf50;
        padding-bottom: 8px;
        margin-bottom: 20px;
      }

      .gallery-grid {
        display: flex;
        flex-direction: column;
        gap: 20px;
        align-items: center;
      }

      .gallery-item {
        background: white;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        border: 1px solid #e0e0e0;
        overflow: hidden;
        width: 100%;
        max-width: 600px;
        text-align: center;
        transition: box-shadow 0.3s ease;
      }

      .gallery-item:hover {
        box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      }

      .gallery-item img {
        width: 100%;
        height: auto;
        display: block;
        cursor: pointer;
      }

      .gallery-item .caption {
        padding: 10px;
        font-size: 0.9em;
        color: #555;
      }

      /* Lightbox */
      .lb-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.85);
        z-index: 9999;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .lb-overlay.active {
        display: flex;
      }

      .lb-overlay img {
        max-width: 90%;
        max-height: 90%;
        border-radius: 6px;
      }

      @media (max-width: 768px) {
        .gallery-item {
          width: calc(50% - 10px);
        }
      }

      @media (max-width: 400px) {
        .gallery-item {
          width: 100%;
        }
      }
    </style>
    <link rel="stylesheet" href="/footer/footer.css" />
  </head>
  <body>
    <script src="/navbar/navbar.js"></script>
    <div id="breadcrumbContainer"></div>
    <script src="/breadcrumb/breadcrumb.js"></script>

    <div class="content-container">
      <h1>Recapito autorizzato</h1>

      <div class="gallery-section">
        <h2>Giusti</h2>
        <div class="gallery-grid">
          <div class="gallery-item">
            <img src="imgRecapito/RecapitoGiusti_1937.jpeg" alt="Recapito Giusti 1937" onclick="openLb(this)">
            <div class="caption">1937</div>
          </div>
          <div class="gallery-item">
            <img src="imgRecapito/RecapitoGiusti_1938.jpeg" alt="Recapito Giusti 1938" onclick="openLb(this)">
            <div class="caption">1938</div>
          </div>
          <div class="gallery-item">
            <img src="imgRecapito/RecapitoGiusti_1939.jpeg" alt="Recapito Giusti 1939" onclick="openLb(this)">
            <div class="caption">1939</div>
          </div>
          <div class="gallery-item">
            <img src="imgRecapito/RecapitoGiusti_1940.jpeg" alt="Recapito Giusti 1940" onclick="openLb(this)">
            <div class="caption">1940</div>
          </div>
        </div>
      </div>

      <div class="gallery-section">
        <h2>Defendini</h2>
        <div class="gallery-grid">
          <div class="gallery-item">
            <img src="imgRecapito/RecapitoDefendini_1943.jpeg" alt="Recapito Defendini 1943" onclick="openLb(this)">
            <div class="caption">1943</div>
          </div>
          <div class="gallery-item">
            <img src="imgRecapito/RecapitoDefendini_1944.jpeg" alt="Recapito Defendini 1944" onclick="openLb(this)">
            <div class="caption">1944</div>
          </div>
          <div class="gallery-item">
            <img src="imgRecapito/RecapitoDefendini_1945.jpeg" alt="Recapito Defendini 1945" onclick="openLb(this)">
            <div class="caption">1945</div>
          </div>
        </div>
      </div>
  </div>

    <div class="lb-overlay" id="lbOverlay" onclick="this.classList.remove('active')">
      <img id="lbImg" src="" alt="Ingrandimento">
    </div>

    <script>
      function openLb(el) {
        document.getElementById('lbImg').src = el.src;
        document.getElementById('lbOverlay').classList.add('active');
      }
    </script>

    <script src="/footer/footer.js"></script>
    <div id="footerContainer"></div>
  </body>
</html>
