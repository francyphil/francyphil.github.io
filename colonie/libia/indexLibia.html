<!doctype html>
<html lang="it">
  <head>
    <link rel="stylesheet" href="/common-bg.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Indice Catalogo Libia</title>
    <script src="/favicon-loader.js"></script>
    <link rel="stylesheet" href="/navbar/navbar.css" />
    <link rel="stylesheet" href="/breadcrumb/breadcrumb.css" />
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 0;
      }

      h1 {
        text-align: center !important;
        color: #2c3e50;
        font-size: 2.2em;
        margin: 40px 0 50px 0;
        font-weight: 600;
      }

      .categories-container {
        max-width: 1100px;
        margin: 0 auto;
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
      }

      .category-card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        padding: 10px;
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        color: inherit;
        border: 2px solid #e0e0e0;
        width: 320px;
        aspect-ratio: 2 / 1;
        text-align: center;
        box-sizing: border-box;
      }

      .category-card:hover {
        box-shadow: 0 6px 20px rgba(76, 175, 80, 0.25);
        border-color: #4caf50;
      }

      .category-icon {
        width: 280px;
        height: 140px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        margin-top: 12px;
        margin-bottom: 12px;
        overflow: hidden;
      }

      .category-icon:not(:has(img)) {
        background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
      }

      .category-icon img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 8px;
      }

      .category-content {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .category-title {
        font-size: 1.2em;
        font-weight: 600;
        color: #2c3e50;
        margin: 0 0 5px 0;
      }

      .category-description {
        font-size: 0.85em;
        color: #7f8c8d;
        margin: 0;
        line-height: 1.4;
      }

      /* Mobile responsive */
      @media (max-width: 768px) {
        h1 {
          font-size: 1.4em !important;
          margin: 25px 15px 30px 15px;
        }

        .categories-container {
          gap: 12px;
          padding: 0 15px;
        }

        .category-card {
          width: calc((100% - 12px) / 2);
          aspect-ratio: auto;
          padding: 15px 10px;
        }

        .category-icon {
          width: 180px;
          height: 90px;
          font-size: 24px;
          border-radius: 10px;
          margin-bottom: 8px;
        }

        .category-title {
          font-size: 1em;
        }
      }

      @media (max-width: 400px) {
        .category-card {
          width: 100%;
        }
      }
    </style>
    <link rel="stylesheet" href="/footer/footer.css" />
  </head>
  <body>
    <script src="/navbar/navbar.js"></script>
    <div id="breadcrumbContainer"></div>
    <script src="/breadcrumb/breadcrumb.js"></script>
    <h1>Catalogo annulli meccanici - Libia</h1>

    <div class="categories-container">

      <a href="/colonie/libia/ufficiLibia.html" class="category-card">
        <div class="category-icon"><img src="icone/libiauffici.jpeg" alt="Uffici"></div>
        <div class="category-content">
          <div class="category-title">Uffici</div>
        </div>
      </a>

      <a href="/colonie/libia/catalogLibia.html" class="category-card">
        <div class="category-icon"><img src="icone/libiatarghette.jpeg" alt="Targhette"></div>
        <div class="category-content">
          <div class="category-title">Targhette</div>
        </div>
      </a>

      <a href="/colonie/libia/barreLibia.html" class="category-card">
        <div class="category-icon"><img src="icone/libiabarre.jpeg" alt="Barre"></div>
        <div class="category-content">
          <div class="category-title">Barre</div>
        </div>
      </a>

      <a href="/colonie/libia/ondeLibia.html" class="category-card">
        <div class="category-icon"><img src="icone/libiaonde.jpeg" alt="Onde"></div>
        <div class="category-content">
          <div class="category-title">Onde</div>
        </div>
      </a>


    </div>

    <script src="/footer/footer.js"></script>
    <div id="footerContainer"></div>
  </body>
</html>
